name: Replace site from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List zip contents
        run: unzip -l TA_SERIES_Live_Original.zip | head -n 200
      - name: Replace repo contents with zip contents
        run: |
          set -e
          test -f TA_SERIES_Live_Original.zip
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'TA_SERIES_Live_Original.zip' -exec rm -rf {} +
          unzip -o TA_SERIES_Live_Original.zip
          rm -rf __MACOSX
          if [ ! -f index.html ]; then
            for d in */; do
              if [ -f "$d/index.html" ]; then
                echo "Moving contents of $d to root"
                mv "$d"index.html .
                mv "$d"* . 2>/dev/null || true
                rm -rf "$d"
                break
              fi
            done
          fi
          rm -f TA_SERIES_Live_Original.zip
          ls -la
          test -f index.html
          test -f style.css
          test -f data.js
          test -f tree.js
          rm -rf .github
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short | head -n 200
          git commit -m "Replace test site with original live website" || echo "No changes to commit"
          git push
