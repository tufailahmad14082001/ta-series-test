name: Move site files to root
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move site files from ta-website-unslop to root
        run: |
          set -e
          ls -la ta-website-unslop
          cp -a ta-website-unslop/. .
          rm -rf ta-website-unslop .github __MACOSX
          ls -la
          test -f index.html
          test -f style.css
          test -f data.js
          test -f tree.js
          test -d app
          test -d files
          test -d functions
          test -d images
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short
          git commit -m "Move site files from ta-website-unslop to repo root" || echo "nothing to commit"
          git push
