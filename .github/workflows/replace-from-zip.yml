name: Replace site from zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo contents from zip
        run: |
          set -e
          rm -rf /tmp/new-site
          mkdir -p /tmp/new-site
          unzip -o TA_SERIES_Test_Unslop.zip -d /tmp/new-site
          ls -la /tmp/new-site
          if [ -d /tmp/new-site/TA_SERIES_Test_Unslop ]; then
            cp -a /tmp/new-site/TA_SERIES_Test_Unslop/. /tmp/new-site/
            rm -rf /tmp/new-site/TA_SERIES_Test_Unslop
          fi
          ls -la /tmp/new-site
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/new-site/. .
          rm -rf __MACOSX
          rm -f TA_SERIES_Test_Unslop.zip
          ls -la
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short
          git commit -m "Replace test site with clean-design version from TA_SERIES_Test_Unslop.zip" || echo "nothing to commit"
          git push
