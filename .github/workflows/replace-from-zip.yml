name: Replace site from zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site files with contents of zip
        run: |
          set -e
          ls -la
          test -f TA_SERIES_Test_Unslop.zip
          rm -rf /tmp/new-site
          mkdir -p /tmp/new-site
          unzip -o TA_SERIES_Test_Unslop.zip -d /tmp/new-site
          ls -la /tmp/new-site
          if [ -d /tmp/new-site/ta-website-unslop ]; then
            cp -a /tmp/new-site/ta-website-unslop/. /tmp/new-site/
            rm -rf /tmp/new-site/ta-website-unslop
          fi
          if [ -d /tmp/new-site/TA_SERIES_Test_Unslop ]; then
            cp -a /tmp/new-site/TA_SERIES_Test_Unslop/. /tmp/new-site/
            rm -rf /tmp/new-site/TA_SERIES_Test_Unslop
          fi
          ls -la /tmp/new-site
          test -f /tmp/new-site/index.html
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/new-site/. .
          rm -rf __MACOSX
          ls -la
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short
          git commit -m "Replace site files with contents of TA_SERIES_Test_Unslop.zip (remove MEGA notice from material.html)" || echo "nothing to commit"
          git push
