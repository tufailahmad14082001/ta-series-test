name: Replace site from zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and replace all files
        run: |
          set -e
          unzip -o TA_SERIES_Test_Unslop.zip -d /tmp/unslop
          echo "--- extracted top level ---"
          ls -la /tmp/unslop
          SRC=/tmp/unslop
          if [ ! -f "$SRC/index.html" ]; then
            for d in "$SRC"/*/; do
              if [ -f "${d}index.html" ]; then SRC="${d%/}"; break; fi
            done
          fi
          echo "Source dir: $SRC"
          ls -la "$SRC"
          test -f "$SRC/index.html"
          test -f "$SRC/style.css"
          test -f "$SRC/data.js"
          test -f "$SRC/tree.js"
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf __MACOSX
          rm -f TA_SERIES_Test_Unslop.zip
          echo "--- new root ---"
          ls -la
          test -f index.html
          test -f style.css
      - name: Commit and push replacement
        run: |
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short
          git commit -m "Replace test site with clean-design version from TA_SERIES_Test_Unslop.zip" || echo "nothing to commit"
          git push
