name: Replace site from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo contents with zip contents
        run: |
          set -e
          unzip -o TA_SERIES_Test_Premium.zip -d /tmp/extracted
          echo "--- extracted top level ---"

          ls -la /tmp/extracted
          SRC=/tmp/extracted
          COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$(find /tmp/extracted -mindepth 1 -maxdepth 1)" ]; then
            SRC=$(find /tmp/extracted -mindepth 1 -maxdepth 1)
          fi
          echo "Source: $SRC"
          ls -la "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'TA_SERIES_Test_Premium.zip' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f TA_SERIES_Test_Premium.zip
          ls -la
          test -f index.html
          test -f style.css
          test -f data.js
          test -f tree.js
          test -f material.html
      - name: Commit and push
        run: |
          git config user.name "tufailahmad14082001"
          git config user.email "tufailahmad14082001@gmail.com"
          git add -A
          git status --short
          git commit -m "Replace site with TA_SERIES_Test_Premium.zip contents" || echo "nothing to commit"
          git push
